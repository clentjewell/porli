name: Verify and deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run check
      - run: npm test

  deploy:
    name: Deploy to Cloudflare
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Requires two repository secrets: CLOUDFLARE_API_TOKEN (Workers Scripts:Edit)
    # and CLOUDFLARE_ACCOUNT_ID. Without them this job fails and nothing is deployed.
    # Skip this job entirely if the Worker is instead connected to the repository
    # from the Cloudflare dashboard (Workers Builds), which deploys on push by itself.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
