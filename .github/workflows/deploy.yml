name: Verify and deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run check
      - run: npm test

  deploy:
    name: Deploy to Cloudflare
    needs: verify
    # Opt-in only. The repository is connected to the Worker from the Cloudflare
    # dashboard (Workers Builds), which deploys every push to main by itself. To
    # deploy from GitHub Actions instead, set the repository variable
    # CLOUDFLARE_DEPLOY_FROM_ACTIONS=true and add the secrets CLOUDFLARE_API_TOKEN
    # (Edit Cloudflare Workers template) and CLOUDFLARE_ACCOUNT_ID.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_DEPLOY_FROM_ACTIONS == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
